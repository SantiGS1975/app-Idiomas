<style>
  html, body, #root { height: 100%; margin: 0; }
  body { background: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
/* Minimal reset (Tailwind preflight equivalent) */
*, *::before, *::after { box-sizing: border-box; border-width: 0; border-style: solid; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; line-height: inherit; }
h1, h2, h3, p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { background: none; padding: 0; cursor: pointer; }
input { background: transparent; border: none; }
svg { display: block; vertical-align: middle; }
ul, ol { margin: 0; padding: 0; list-style: none; }

/* Layout */
.absolute { position: absolute; }
.fixed { position: fixed; }
.relative { position: relative; }
.inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
.top-0 { top: 0; }
.left-0 { left: 0; }
.top-1\/2 { top: 50%; }
.left-1\/2 { left: 50%; }
.left-3 { left: 0.75rem; }
.bottom-5 { bottom: 1.25rem; }
.z-40 { z-index: 40; }
.z-50 { z-index: 50; }
.-translate-y-1\/2 { transform: translateY(-50%); }

.block { display: block; }
.flex { display: flex; }
.grid { display: grid; }
.hidden { display: none; }
.flex-col { flex-direction: column; }
.flex-wrap { flex-wrap: wrap; }
.flex-1 { flex: 1 1 0%; }
.shrink-0 { flex-shrink: 0; }
.items-center { align-items: center; }
.items-start { align-items: flex-start; }
.items-end { align-items: flex-end; }
.justify-center { justify-content: center; }
.justify-between { justify-content: space-between; }
.gap-1 { gap: 0.25rem; }
.gap-1\.5 { gap: 0.375rem; }
.gap-2 { gap: 0.5rem; }
.gap-3 { gap: 0.75rem; }
.gap-4 { gap: 1rem; }
.grid-cols-1 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
.grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.space-y-2 > * + * { margin-top: 0.5rem; }
.space-y-3 > * + * { margin-top: 0.75rem; }
.space-y-4 > * + * { margin-top: 1rem; }

/* Sizing */
.w-full { width: 100%; }
.w-1 { width: 0.25rem; }
.w-2 { width: 0.5rem; }
.w-8 { width: 2rem; }
.h-full { height: 100%; }
.h-1\.5 { height: 0.375rem; }
.h-2 { height: 0.5rem; }
