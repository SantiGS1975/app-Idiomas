const { useState, useEffect, useCallback, useRef } = React;

// ---------- localStorage-backed shim of the artifact "window.storage" API ----------
window.storage = {
  async get(key) {
    try {
      const v = localStorage.getItem(key);
      return v !== null ? { key, value: v, shared: false } : null;
    } catch (e) { throw e; }
  },
  async set(key, value) {
    localStorage.setItem(key, value);
    return { key, value, shared: false };
  },
  async delete(key) {
    localStorage.removeItem(key);
    return { key, deleted: true, shared: false };
  },
  async list(prefix) {
    const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
    return { keys, prefix, shared: false };
  },
};

// ---------- Minimal inline-SVG icon set (stand-ins for lucide-react) ----------

      fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
      className={className} style={style}>
      {children}
    </svg>
  );
}
const BookOpen = (p) => <Icon {...p}><path d="M2 4h7a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/><path d="M22 4h-7a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h8z"/></Icon>;

const RotateCcw = (p) => <Icon {...p}><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 3 3 9 9 9"/></Icon>;

// ---------- Design tokens ----------
const C = {
  bg: "#FFFFFF",
  surface: "#F6F4EE",
  surfaceLight: "#EDEAE0",
  ink: "#1B2420",
  inkMuted: "#5C6B60",
  inkFaint: "#94A099",
  accent: "#E8A33D",
  accent2: "#4FA873",
  danger: "#D9634F",
  border: "#E4E0D3",
};

const STORAGE_KEY = "flashcards-app-data-v1";

const LANGUAGES = [
  { code: "en-US", label: "Inglés" },
  { code: "es-ES", label: "Español" },
  { code: "fr-FR", label: "Francés" },
  { code: "de-DE", label: "Alemán" },
  { code: "it-IT", label: "Italiano" },
  { code: "pt-PT", label: "Portugués" },
  { code: "ja-JP", label: "Japonés" },
  { code: "ko-KR", label: "Coreano" },
  { code: "zh-CN", label: "Chino" },
  { code: "ru-RU", label: "Ruso" },
  { code: "ar-SA", label: "Árabe" },
  { code: "nl-NL", label: "Neerlandés" },
];

const PASTELS = ["#FFD9E3", "#D9E8FF", "#FFF3C2", "#DFF5DD", "#E7DBFF", "#FFE1CC"];

let voicesCache = [];
function loadVoices() {
  if (typeof window === "undefined" || !window.speechSynthesis) return;
  voicesCache = window.speechSynthesis.getVoices();
  if (!voicesCache.length) {
    window.speechSynthesis.onvoiceschanged = () => {
      voicesCache = window.speechSynthesis.getVoices();
    };
  }
}

let activeUtterance = null; // kept in module scope so Chrome doesn't garbage-collect it mid-speech

function speak(text, lang, onFail) {
  try {
    if (!window.speechSynthesis || !text) {
      if (onFail) onFail();
      return;
    }
    window.speechSynthesis.cancel();
    setTimeout(() => {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang || "es-ES";
      const base = (lang || "es-ES").split("-")[0];
      const voice =
        voicesCache.find((v) => v.lang === lang) ||
        voicesCache.find((v) => v.lang && v.lang.startsWith(base));
      if (voice) u.voice = voice;
      u.rate = 0.95;
      if (onFail) u.onerror = onFail;
      activeUtterance = u;
      window.speechSynthesis.speak(u);
    }, 50);
  } catch (e) {
    if (onFail) onFail();
  }
}

// ---------- Helpers ----------
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const now = () => Date.now();
const DAY = 24 * 60 * 60 * 1000;

const todayStr = () => new Date().toISOString().slice(0, 10);

const strip = (s) =>
  (s ?? "").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();

function newCard(front, back, note = "") {
  return {
    id: uid(),
    front: front.trim(),
    back: back.trim(),
    note: (note || "").trim(),
    ef: 2.5,
    interval: 0,
    reps: 0,
    lapses: 0,
    due: now(),
    createdAt: now(),
  };
}

function newDeck(name, frontLang = "en-US", backLang = "es-ES", pastel = PASTELS[0]) {
  return { id: uid(), name, frontLang, backLang, pastel, cards: [], createdAt: now() };
}

// SM-2 style scheduler. quality: 1=again, 3=hard, 4=good, 5=easy
function schedule(card, quality) {
  let { ef, interval, reps, lapses } = card;
  if (quality < 3) {
    reps = 0;
    interval = 1;
    lapses += 1;
  } else {
    if (reps === 0) interval = 1;
    else if (reps === 1) interval = 6;
    else interval = Math.round(interval * ef);
    reps += 1;
  }
  ef = Math.max(1.3, ef + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02)));
  return { ...card, ef, interval, reps, lapses, due: now() + interval * DAY };
}

function dueCards(deck) {
  const t = now();
  return deck.cards.filter((c) => c.due <= t);
}

// ---------- Excel parsing ----------
const FRONT_KEYS = ["word", "palabra", "termino", "term", "front", "vocablo", "vocabulario"];
const BACK_KEYS = ["translation", "traduccion", "meaning", "significado", "back", "definicion", "respuesta"];
const NOTE_KEYS = ["example", "ejemplo", "note", "nota", "oracion", "frase", "contexto"];

function parseWorkbookRows(rows) {
  if (!rows.length) return [];
  const header = rows[0].map(strip);
  const fIdx = header.findIndex((h) => FRONT_KEYS.includes(h));
  const bIdx = header.findIndex((h) => BACK_KEYS.includes(h));
  const nIdx = header.findIndex((h) => NOTE_KEYS.includes(h));

  let start = 0;
  let fi = 0, bi = 1, ni = 2;
  if (fIdx !== -1 && bIdx !== -1) {
    fi = fIdx; bi = bIdx; ni = nIdx === -1 ? -1 : nIdx;
    start = 1;
  }
  const out = [];
  for (let i = start; i < rows.length; i++) {
    const row = rows[i];
    if (!row) continue;
    const front = (row[fi] ?? "").toString().trim();
    const back = (row[bi] ?? "").toString().trim();
    if (!front || !back) continue;
    const note = ni !== -1 ? (row[ni] ?? "").toString().trim() : "";
    out.push(newCard(front, back, note));
  }
  return out.slice(0, 2000);
}

// ---------- App ----------
function App() {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [view, setView] = useState("home"); // home | deck | study | stats
  const [activeDeckId, setActiveDeckId] = useState(null);
  const [cardModal, setCardModal] = useState(null); // {id?, front, back, note}
  const [deckModalOpen, setDeckModalOpen] = useState(false);
  const [importState, setImportState] = useState(null); // {cards, fileName, deckId, newDeckName}
  const [search, setSearch] = useState("");
  const [toast, setToast] = useState(null);
  const fileInputRef = useRef(null);

  useEffect(() => {
    loadVoices();
    (async () => {
      try {
        const res = await window.storage.get(STORAGE_KEY, false);
        if (res && res.value) {
          setData(JSON.parse(res.value));
        } else {
          setData({ decks: [], meta: { streak: 0, lastStudyDay: null, totalReviews: 0 } });
        }
      } catch (e) {
        setData({ decks: [], meta: { streak: 0, lastStudyDay: null, totalReviews: 0 } });
      } finally {
        setLoading(false);
      }
    })();
  }, []);

  const persist = useCallback(async (next) => {
    setData(next);
    try {
      await window.storage.set(STORAGE_KEY, JSON.stringify(next), false);
    } catch (e) {
      console.error("Storage error", e);
    }
  }, []);

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 2400);
  };

  if (loading || !data) {
    return (
      <div style={{ background: C.bg, color: C.ink }} className="w-full h-full min-h-screen flex items-center justify-center">
        <Loader2 className="animate-spin" size={28} style={{ color: C.accent }} />
      </div>
    );
  }

  const activeDeck = data.decks.find((d) => d.id === activeDeckId) || null;

  // ----- deck CRUD -----
  const addDeck = ({ name, frontLang, backLang, pastel }) => {
    const d = newDeck(name.trim() || "Nuevo mazo", frontLang, backLang, pastel);
    persist({ ...data, decks: [...data.decks, d] });
    setDeckModalOpen(false);
    showToast("Mazo creado");
  };

  const deleteDeck = (id) => {
    persist({ ...data, decks: data.decks.filter((d) => d.id !== id) });
    if (activeDeckId === id) { setActiveDeckId(null); setView("home"); }
    showToast("Mazo eliminado");
  };

  const renameDeck = (id, name) => {
    persist({ ...data, decks: data.decks.map((d) => (d.id === id ? { ...d, name } : d)) });
  };

  // ----- card CRUD -----
  const saveCard = (deckId, card) => {
    const decks = data.decks.map((d) => {
      if (d.id !== deckId) return d;
      if (card.id) {
        return { ...d, cards: d.cards.map((c) => (c.id === card.id ? { ...c, front: card.front, back: card.back, note: card.note } : c)) };
      }
      return { ...d, cards: [...d.cards, newCard(card.front, card.back, card.note)] };
    });
    persist({ ...data, decks });
    setCardModal(null);
    showToast(card.id ? "Tarjeta actualizada" : "Tarjeta añadida");
  };

  const deleteCard = (deckId, cardId) => {
    const decks = data.decks.map((d) => (d.id !== deckId ? d : { ...d, cards: d.cards.filter((c) => c.id !== cardId) }));
    persist({ ...data, decks });
  };

  // ----- import -----
  const handleFile = (file) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(e.target.result, { type: "array" });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
        const cards = parseWorkbookRows(rows);
        if (!cards.length) {
          showToast("No se encontraron tarjetas válidas en el archivo");
          return;
        }
        const fileName = file.name.replace(/\.[^/.]+$/, "");
        setImportState({ cards, fileName, deckId: "new", newDeckName: fileName });
      } catch (err) {
        showToast("No se pudo leer el archivo");
      }
    };
    reader.readAsArrayBuffer(file);
  };

  const confirmImport = () => {
    if (!importState) return;
    let decks;
    if (importState.deckId === "new") {
      const d = newDeck(importState.newDeckName.trim() || importState.fileName);
      d.cards = importState.cards;
      decks = [...data.decks, d];
    } else {
      decks = data.decks.map((d) => (d.id === importState.deckId ? { ...d, cards: [...d.cards, ...importState.cards] } : d));
    }
    persist({ ...data, decks });
    showToast(`${importState.cards.length} tarjetas importadas`);
    setImportState(null);
  };

  // ----- study session -----
  const finishStudy = (results) => {
    // results: {studied, correct}
    const today = todayStr();
    let { streak, lastStudyDay, totalReviews } = data.meta;
    if (lastStudyDay !== today) {
      const y = new Date(Date.now() - DAY).toISOString().slice(0, 10);
      streak = lastStudyDay === y ? streak + 1 : 1;
      lastStudyDay = today;
    }
    totalReviews += results.studied;
    persist({ ...data, meta: { streak, lastStudyDay, totalReviews } });
  };

  const updateCardsAfterStudy = (deckId, updatedCards) => {
    const decks = data.decks.map((d) => {
      if (d.id !== deckId) return d;
      const map = Object.fromEntries(updatedCards.map((c) => [c.id, c]));
      return { ...d, cards: d.cards.map((c) => map[c.id] || c) };
    });
    persist({ ...data, decks });
  };

  const totalDue = data.decks.reduce((s, d) => s + dueCards(d).length, 0);
  const totalCards = data.decks.reduce((s, d) => s + d.cards.length, 0);

  return (
    <div style={{ background: C.bg, color: C.ink, minHeight: "100vh" }} className="w-full font-body">
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
        .font-display { font-family: 'Fraunces', serif; }
        .font-body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'IBM Plex Mono', monospace; }
        .chalk-btn { transition: transform .12s ease, opacity .12s ease; }
        .chalk-btn:active { transform: scale(0.97); }
        .flip-card { perspective: 1400px; }
        .flip-inner { transition: transform .5s cubic-bezier(.4,.2,.2,1); transform-style: preserve-3d; }
        .flip-inner.flipped { transform: rotateY(180deg); }
        .flip-face { backface-visibility: hidden; }
        .flip-back { transform: rotateY(180deg); }
        @keyframes toastIn { from { opacity:0; transform: translate(-50%,10px);} to {opacity:1; transform: translate(-50%,0);} }
      `}</style>

      {toast && (
        <div
          style={{ background: C.surfaceLight, color: C.ink, border: `1px solid ${C.border}`, animation: "toastIn .2s ease" }}
          className="fixed bottom-5 left-1/2 z-50 px-4 py-2 rounded-full text-sm shadow-lg font-body"
        >
          {toast}
        </div>
      )}

      {view === "home" && (
        <HomeView
          data={data}
          totalDue={totalDue}
          totalCards={totalCards}
          onOpenDeck={(id) => { setActiveDeckId(id); setView("deck"); }}
          onNewDeck={() => setDeckModalOpen(true)}
          onImportClick={() => fileInputRef.current?.click()}
          onStats={() => setView("stats")}
          onDeleteDeck={deleteDeck}
        />
      )}

      {view === "deck" && activeDeck && (
        <DeckView
          deck={activeDeck}
          search={search}
          setSearch={setSearch}
          onBack={() => { setView("home"); setSearch(""); }}
          onAddCard={() => setCardModal({ front: "", back: "", note: "" })}
          onEditCard={(c) => setCardModal(c)}
          onDeleteCard={(cardId) => deleteCard(activeDeck.id, cardId)}
          onStudy={() => setView("study")}
          onRename={(name) => renameDeck(activeDeck.id, name)}
          onExport={() => exportDeck(activeDeck)}
          onSpeakFail={() => showToast("Este navegador no puede leer en voz alta ese idioma")}
        />
      )}

      {view === "study" && activeDeck && (
        <StudyView
          deck={activeDeck}
          onExit={() => setView("deck")}
          onFinish={(updated, results) => {
            updateCardsAfterStudy(activeDeck.id, updated);
            finishStudy(results);
          }}
          onSpeakFail={() => showToast("Este navegador no puede leer en voz alta ese idioma")}
        />
      )}

      {view === "stats" && (
        <StatsView data={data} onBack={() => setView("home")} />
      )}

      {deckModalOpen && (
        <DeckModal onClose={() => setDeckModalOpen(false)} onSave={addDeck} />
      )}

      {cardModal && activeDeck && (
        <CardModal
          card={cardModal}
          onClose={() => setCardModal(null)}
          onSave={(c) => saveCard(activeDeck.id, c)}
        />
      )}

      <input
        ref={fileInputRef}
        type="file"
        accept=".xlsx,.xls,.csv"
        className="hidden"
        onChange={(e) => {
          const f = e.target.files?.[0];
          if (f) handleFile(f);
          e.target.value = "";
        }}
      />

      {importState && (
        <ImportModal
          state={importState}
          decks={data.decks}
          setState={setImportState}
          onConfirm={confirmImport}
          onCancel={() => setImportState(null)}
        />
      )}
    </div>
  );
}

function exportDeck(deck) {
  const blob = new Blob([JSON.stringify(deck, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${deck.name}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

// ---------- Home ----------
function HomeView({ data, totalDue, totalCards, onOpenDeck, onNewDeck, onImportClick, onStats, onDeleteDeck }) {
  return (
    <div className="max-w-3xl mx-auto px-5 py-8">
      <div className="flex items-start justify-between mb-8">
        <div>
          <div className="flex items-center gap-2 mb-1">
            <Sparkles size={16} style={{ color: C.accent }} />
            <span className="text-xs tracking-widest uppercase font-mono" style={{ color: C.inkFaint }}>Pro</span>
          </div>
          <h1 className="font-display text-3xl" style={{ color: C.ink }}>Pizarra de idiomas</h1>
          <p className="text-sm mt-1" style={{ color: C.inkMuted }}>
            {totalCards} tarjetas · {totalDue} para repasar hoy
          </p>
        </div>
        <button
          onClick={onStats}
          className="chalk-btn flex items-center gap-2 px-3 py-2 rounded-full text-sm"
          style={{ background: C.surface, border: `1px solid ${C.border}`, color: C.ink }}
        >
          <Flame size={16} style={{ color: data.meta.streak > 0 ? C.accent : C.inkFaint }} />
          <span className="font-mono">{data.meta.streak}</span>
        </button>
      </div>

      <div className="flex gap-3 mb-8">
        <button
          onClick={onNewDeck}
          className="chalk-btn flex-1 flex items-center justify-center gap-2 py-3 rounded-xl text-sm font-medium"
          style={{ background: C.accent, color: "#1B2420" }}
        >
          <Plus size={18} /> Nuevo mazo
        </button>
        <button
          onClick={onImportClick}
          className="chalk-btn flex-1 flex items-center justify-center gap-2 py-3 rounded-xl text-sm font-medium"
          style={{ background: C.surface, border: `1px solid ${C.border}`, color: C.ink }}
        >
          <Upload size={18} /> Importar Excel
        </button>
      </div>

      {data.decks.length === 0 ? (
        <div
          className="rounded-2xl p-10 text-center"
          style={{ background: C.surface, border: `1px dashed ${C.border}` }}
        >
          <BookOpen size={28} className="mx-auto mb-3" style={{ color: C.inkFaint }} />
          <p className="font-display text-lg mb-1">La pizarra está limpia</p>
          <p className="text-sm" style={{ color: C.inkMuted }}>
            Crea un mazo o sube un Excel con columnas como "Palabra" y "Traducción" para empezar.
          </p>
        </div>
      ) : (
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          {data.decks.map((d) => {

// ---------- Study ----------
function StudyView({ deck, onExit, onFinish, onSpeakFail }) {
  const [queue] = useState(() => {
    const d = dueCards(deck);
    for (let i = d.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [d[i], d[j]] = [d[j], d[i]];
    }
    return d;
  });
  const [index, setIndex] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [updated, setUpdated] = useState([]);
  const [correct, setCorrect] = useState(0);
  const [done, setDone] = useState(false);

  const current = queue[index];

  useEffect(() => {
    if (current) speak(current.front, deck.frontLang, onSpeakFail);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [current?.id]);

  useEffect(() => {
    if (flipped && current) speak(current.back, deck.backLang, onSpeakFail);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [flipped]);

  const answer = (quality) => {
    const upd = schedule(current, quality);
    setUpdated((u) => [...u, upd]);
    if (quality >= 3) setCorrect((c) => c + 1);
    if (index + 1 >= queue.length) {
      setDone(true);
    } else {
      setIndex((i) => i + 1);
      setFlipped(false);
    }
  };

  useEffect(() => {
    if (done) {
      onFinish([...updated], { studied: queue.length, correct });
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [done]);

  if (queue.length === 0) {
    return (
      <div className="max-w-md mx-auto px-5 py-16 text-center">
        <p style={{ color: C.inkMuted }}>No hay tarjetas para repasar.</p>
        <button onClick={onExit} className="mt-4 px-4 py-2 rounded-lg text-sm" style={{ background: C.surface, color: C.ink }}>Volver</button>
      </div>
    );
  }

  if (done) {
    const pct = Math.round((correct / queue.length) * 100);
    return (
      <div className="max-w-md mx-auto px-5 py-16 text-center">
        <Sparkles size={30} className="mx-auto mb-4" style={{ color: C.accent }} />
        <h2 className="font-display text-2xl mb-2">Sesión completa</h2>
        <p className="text-sm mb-6" style={{ color: C.inkMuted }}>
          {correct} de {queue.length} correctas · {pct}%
        </p>
        <button
          onClick={onExit}
          className="chalk-btn px-6 py-3 rounded-xl text-sm font-medium"
          style={{ background: C.accent, color: "#1B2420" }}
        >
          Volver al mazo
        </button>
      </div>
    );
  }

  return (
    <div className="max-w-md mx-auto px-5 py-8 flex flex-col min-h-screen">
      <div className="flex items-center justify-between mb-6">
        <button onClick={onExit} style={{ color: C.inkMuted }}><X size={20} /></button>
        <div className="flex-1 mx-4 h-1.5 rounded-full" style={{ background: C.surface }}>
          <div
            className="h-full rounded-full transition-all"
            style={{ width: `${(index / queue.length) * 100}%`, background: C.accent }}
          />
        </div>
        <span className="text-xs font-mono" style={{ color: C.inkFaint }}>{index + 1}/{queue.length}</span>
      </div>

      <div className="flex-1 flex items-center justify-center flip-card">
        <div
          onClick={() => setFlipped((f) => !f)}
          className="relative w-full cursor-pointer"
          style={{ height: 280 }}
        >
          <div className={`flip-inner relative w-full h-full ${flipped ? "flipped" : ""}`}>
            <div
              className="flip-face absolute inset-0 rounded-2xl flex flex-col items-center justify-center p-8 text-center shadow-xl"
              style={{ background: "#FFFFFF", border: `1px solid ${C.border}` }}
            >
              <span className="text-xs uppercase tracking-widest font-mono mb-4" style={{ color: "#9A9488" }}>
                {LANGUAGES.find((l) => l.code === deck.frontLang)?.label || "Palabra"}
              </span>
              <p className="font-display text-3xl" style={{ color: "#1B2420" }}>{current.front}</p>
              <button
                onClick={(e) => { e.stopPropagation(); speak(current.front, deck.frontLang, onSpeakFail); }}
                className="chalk-btn mt-5 p-2 rounded-full"
                style={{ background: "#F1EDE1" }}
              >
                <Volume2 size={16} style={{ color: "#1B2420" }} />
              </button>
              <span className="text-xs mt-6" style={{ color: "#B5AFA1" }}>Toca para voltear</span>
            </div>
            <div
              className="flip-face flip-back absolute inset-0 rounded-2xl flex flex-col items-center justify-center p-8 text-center shadow-xl"
              style={{ background: deck.pastel || PASTELS[0], border: `1px solid ${C.border}` }}
            >
              <span className="text-xs uppercase tracking-widest font-mono mb-4" style={{ color: "#5A5348" }}>
                {LANGUAGES.find((l) => l.code === deck.backLang)?.label || "Traducción"}
              </span>
              <p className="font-display text-3xl mb-2" style={{ color: "#1B2420" }}>{current.back}</p>
              {current.note && <p className="text-sm italic mt-2" style={{ color: "#5A5348" }}>{current.note}</p>}
              <button
                onClick={(e) => { e.stopPropagation(); speak(current.back, deck.backLang, onSpeakFail); }}
                className="chalk-btn mt-5 p-2 rounded-full"
                style={{ background: "rgba(27,36,32,0.1)" }}
              >
                <Volume2 size={16} style={{ color: "#1B2420" }} />
              </button>
            </div>
          </div>
        </div>
      </div>

      <div className="mt-8">
        {!flipped ? (
          <button
            onClick={() => setFlipped(true)}
            className="chalk-btn w-full py-4 rounded-xl text-sm font-medium"
            style={{ background: C.accent, color: "#1B2420" }}
          >
            Mostrar respuesta
          </button>
        ) : (
          <div className="grid grid-cols-4 gap-2">
            <button onClick={() => answer(1)} className="chalk-btn py-3 rounded-xl text-xs font-medium flex flex-col items-center gap-1" style={{ background: "rgba(217,112,96,0.15)", color: C.danger }}>
              <X size={16} /> De nuevo
            </button>
            <button onClick={() => answer(3)} className="chalk-btn py-3 rounded-xl text-xs font-medium flex flex-col items-center gap-1" style={{ background: "rgba(232,163,61,0.15)", color: C.accent }}>
              <RotateCcw size={16} /> Difícil
            </button>
            <button onClick={() => answer(4)} className="chalk-btn py-3 rounded-xl text-xs font-medium flex flex-col items-center gap-1" style={{ background: "rgba(111,191,139,0.15)", color: C.accent2 }}>
              <Check size={16} /> Bien
            </button>
            <button onClick={() => answer(5)} className="chalk-btn py-3 rounded-xl text-xs font-medium flex flex-col items-center gap-1" style={{ background: "rgba(111,191,139,0.25)", color: C.accent2 }}>
              <Sparkles size={16} /> Fácil
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

function StatsView({ data, onBack }) {
  const totalCards = data.decks.reduce((s, d) => s + d.cards.length, 0);
  const totalDue = data.decks.reduce((s, d) => s + dueCards(d).length, 0);
  const mastered = data.decks.reduce((s, d) => s + d.cards.filter((c) => c.reps >= 3).length, 0);

  return (
    <div className="max-w-3xl mx-auto px-5 py-8">
      <button onClick={onBack} className="flex items-center gap-1 text-sm mb-6" style={{ color: C.inkMuted }}>
        <ChevronLeft size={16} /> Volver
      </button>
      <h1 className="font-display text-2xl mb-6">Tu progreso</h1>

      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-8">
        {[
          { label: "Racha", value: data.meta.streak, icon: Flame, color: C.accent },
          { label: "Tarjetas", value: totalCards, icon: BookOpen, color: C.ink },
          { label: "Para hoy", value: totalDue, icon: Clock, color: C.accent },
          { label: "Dominadas", value: mastered, icon: Sparkles, color: C.accent2 },
        ].map((s) => (
          <div key={s.label} className="rounded-xl p-4 shadow-sm" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
            <s.icon size={16} style={{ color: s.color }} />
            <p className="font-display text-2xl mt-2" style={{ color: C.ink }}>{s.value}</p>
            <p className="text-xs" style={{ color: C.inkMuted }}>{s.label}</p>
          </div>
        ))}
      </div>

      <p className="text-xs uppercase tracking-widest font-mono mb-3" style={{ color: C.inkFaint }}>Por mazo</p>
      <div className="space-y-3">
        {data.decks.map((d) => {
          const m = d.cards.filter((c) => c.reps >= 3).length;
          const pct = d.cards.length ? Math.round((m / d.cards.length) * 100) : 0;
          return (
            <div key={d.id} className="rounded-xl p-4 shadow-sm" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
              <div className="flex justify-between text-sm mb-2">
                <span style={{ color: C.ink }}>{d.name}</span>
                <span className="font-mono" style={{ color: C.inkMuted }}>{pct}%</span>
              </div>
              <div className="h-2 rounded-full" style={{ background: C.bg }}>
                <div className="h-full rounded-full" style={{ width: `${pct}%`, background: d.pastel || PASTELS[0] }} />
              </div>
            </div>
          );
        })}
        {data.decks.length === 0 && <p className="text-sm" style={{ color: C.inkFaint }}>Aún no hay mazos.</p>}
      </div>
    </div>
  );
}

    <ModalShell onClose={onClose} title="Nuevo mazo">
      <label className="text-xs font-mono mb-1 block" style={{ color: C.inkFaint }}>Nombre</label>
      <input

            {LANGUAGES.map((l) => <option key={l.code} value={l.code}>{l.label}</option>)}
          </select>
        </div>
        <div>
          <label className="text-xs font-mono mb-1 block" style={{ color: C.inkFaint }}>Idioma de traducción</label>

  );
}

function ModalShell({ title, onClose, children }) {
  return (
    <div className="fixed inset-0 z-40 flex items-end sm:items-center justify-center p-0 sm:p-4" style={{ background: "rgba(0,0,0,0.55)" }} onClick={onClose}>
      <div
        onClick={(e) => e.stopPropagation()}
        className="w-full sm:max-w-sm rounded-t-2xl sm:rounded-2xl p-5 shadow-2xl"
        style={{ background: "#FFFFFF", border: `1px solid ${C.border}` }}
      >
        <div className="flex items-center justify-between mb-4">
          <h3 className="font-display text-lg" style={{ color: C.ink }}>{title}</h3>
          <button onClick={onClose} style={{ color: C.inkFaint }}><X size={18} /></button>
        </div>
        {children}
      </div>
    </div>
  );
}
const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<App />);
</script>
</body>
</html>
